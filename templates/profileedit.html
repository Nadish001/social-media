{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="/static/css/profileedit.css">

<div class="form-card">
    <h2>Edit profile</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <a class="cancel" href="{% url 'profile' %}">Cancel</a>
            <input type="submit" value="Save changes">
        </div>
    </form>
</div>
{% endblock %}
